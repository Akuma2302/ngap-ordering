# Netlify: build the static site from frontend/ (see docs/NETLIFY.md).
[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Root URL opens the salesperson app (order.html also redirects there).
[[redirects]]
  from = "/"
  to = "/sales.html"
  status = 302

# Keep the admin page out of search engines.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
