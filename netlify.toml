# Static site: no build step, publish the repo root.
[build]
  publish = "."
  command = ""

# Root URL goes straight to the agent order page.
[[redirects]]
  from = "/"
  to = "/order.html"
  status = 302

# Keep the admin page out of search engines.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
